[package]
name = "blacknode-motion"
version = "0.5.0"
description = "Arm and base planning, trajectory generation, execution, policy, arbitration, and motion safety for Blacknode."
requires-blacknode = ">=0.3.0"
layer = "motion"
component-mode = true

[categories]
"Motion" = "#f97316"

[components.core]
description = "Motion ownership, priority, and command-arbitration contracts."
default = false
capabilities = ["motion.core", "motion.arbitration"]

[components.arm]
description = "Arm planning, trajectory generation, execution, and manipulation."
default = true
capabilities = ["motion.arm", "motion.arm.planning", "motion.arm.trajectory", "motion.arm.execution"]
nodes = ["components/arm/trajectory/nodes"]
node-types = ["JointMotionProfile"]

[components.arm.adapters.ros2]
description = "Arm state and command control surfaces over ROS 2 transports."
default = true
capabilities = ["adapter.motion.arm.ros2"]
nodes = ["components/arm/adapters/ros2/nodes"]
templates = ["components/arm/adapters/ros2/templates"]
node-types = [
  "ROS2JointSliders", "ROS2JointState", "ROS2ManualMove",
  "ROS2MotionDashboard", "ROS2SetJoint",
]

[components.arm.adapters.ros2.dependencies]
requires = [{ package = "blacknode-ros2", component = "core", version = ">=0.5.6,<1.0.0" }]

[components.base]
description = "Mobile-base planning, navigation-provider integration, and execution."
default = false
capabilities = ["motion.base", "motion.base.planning", "motion.base.execution"]

[components.base.adapters.ros2]
description = "Safety-gated mobile-base commands, scan checks, odometry, and stop over ROS 2 transports."
default = false
capabilities = ["adapter.motion.base.ros2"]
nodes = ["components/base/adapters/ros2/nodes"]
templates = ["components/base/adapters/ros2/templates"]
node-types = ["BaseSafetyGate", "ROS2BaseMove", "ROS2BaseStop", "ROS2LaserScanCheck", "ROS2OdomState"]

[components.base.adapters.ros2.dependencies]
requires = [{ package = "blacknode-ros2", component = "rosbridge", version = ">=0.5.8,<1.0.0" }]

[components.policy]
description = "Learned-policy motion planning, execution, and lifecycle contracts."
default = true
capabilities = ["motion.policy"]
nodes = ["components/policy/nodes"]

[components.policy.dependencies]
pip = ["numpy>=1.24", "pillow>=10"]
imports = ["numpy", "PIL"]

[components.policy.adapters.ros2]
description = "Safety-gated learned-policy lifecycle and ROS 2 execution."
default = false
capabilities = ["adapter.motion.policy.ros2"]
nodes = ["components/policy/adapters/ros2/nodes"]
templates = ["components/policy/adapters/ros2/templates"]
node-types = ["PolicyRuntime", "PolicySafetyGate"]

[components.policy.adapters.ros2.dependencies]
requires = [{ package = "blacknode-ros2", component = "rosbridge", version = ">=0.5.8,<1.0.0" }]

[components.safety]
description = "Motion freshness, limits, stop, and shutdown supervision."
default = false
capabilities = ["motion.safety", "motion.safety-supervision"]
